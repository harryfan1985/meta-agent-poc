[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meta-agent-poc"
version = "0.0.1"
description = "Spec-driven multi-agent engine (compiler + runtime). M0 skeleton."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2",
    "jsonschema>=4",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "hypothesis"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
